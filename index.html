<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高雄健身房探索地圖 Kaohsiung Gym Map</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        /* Custom Leaflet Popup Styling */
        .leaflet-popup-content-wrapper {
            border-radius: 1rem;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .leaflet-popup-content {
            margin: 0;
            width: 280px !important;
        }
        /* Custom Scrollbar for Sidebar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* Pulse Animation for Active Marker */
        @keyframes customPulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .active-marker {
            animation: customPulse 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col overflow-hidden">

    <!-- Top Header -->
    <header class="bg-slate-800/90 backdrop-blur-md border-b border-slate-700/60 px-4 py-3 flex items-center justify-between z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-600 flex items-center justify-center text-white shadow-lg shadow-orange-500/20">
                <i class="fa-solid font-bold fa-dumbbell text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-white tracking-wide leading-tight">高雄健身房地圖</h1>
                <p class="text-xs text-slate-400">Kaohsiung Gym Explorer</p>
            </div>
        </div>

        <!-- Right Header Badges -->
        <div class="flex items-center space-x-2">
            <div id="gym-count-badge" class="bg-slate-700/80 text-amber-400 text-xs px-3 py-1.5 rounded-full font-medium border border-slate-600 flex items-center space-x-1.5">
                <i class="fa-solid fa-location-dot"></i>
                <span id="total-count">5</span> 處健身據點
            </div>
            <!-- Mobile Toggle Sidebar Button -->
            <button id="toggle-sidebar-btn" class="md:hidden bg-slate-700 p-2 rounded-lg text-slate-200 hover:text-white hover:bg-slate-600 transition">
                <i class="fa-solid fa-list-ul text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="flex-1 flex relative overflow-hidden">
        
        <!-- Sidebar Panel -->
        <aside id="sidebar" class="absolute md:relative z-10 w-full md:w-96 h-full bg-slate-800 border-r border-slate-700/80 flex flex-col transition-transform duration-300 transform translate-x-0 md:translate-x-0">
            
            <!-- Search & Filter Bar -->
            <div class="p-4 border-b border-slate-700/80 bg-slate-800/50 space-y-3">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="search-input" placeholder="搜尋店名、行政區、地址..." 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-9 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition">
                    <button id="clear-search-btn" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200">
                        <i class="fa-solid fa-circle-xmark text-sm"></i>
                    </button>
                </div>

                <!-- Quick District Filter Tags -->
                <div class="flex items-center space-x-1.5 overflow-x-auto pb-1 text-xs no-scrollbar" id="district-tags">
                    <button class="district-tag active bg-amber-500 text-slate-950 font-semibold px-2.5 py-1 rounded-lg shrink-0 transition" data-district="ALL">全部</button>
                    <button class="district-tag bg-slate-700 text-slate-300 hover:bg-slate-600 px-2.5 py-1 rounded-lg shrink-0 transition" data-district="新興區">新興區</button>
                    <button class="district-tag bg-slate-700 text-slate-300 hover:bg-slate-600 px-2.5 py-1 rounded-lg shrink-0 transition" data-district="左營區">左營區</button>
                    <button class="district-tag bg-slate-700 text-slate-300 hover:bg-slate-600 px-2.5 py-1 rounded-lg shrink-0 transition" data-district="三民區">三民區</button>
                    <button class="district-tag bg-slate-700 text-slate-300 hover:bg-slate-600 px-2.5 py-1 rounded-lg shrink-0 transition" data-district="前金區">前金區</button>
                </div>
            </div>

            <!-- Gym List -->
            <div id="gym-list" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Dynamically Populated -->
            </div>

            <!-- Sidebar Footer -->
            <div class="p-3 border-t border-slate-700/80 bg-slate-900/60 text-center text-xs text-slate-400">
                <i class="fa-solid fa-database text-amber-500/80 mr-1"></i> 資料來源：實體高雄健身房 CSV 資料檔
            </div>
        </aside>

        <!-- Map Canvas Area -->
        <main class="flex-1 h-full relative bg-slate-950">
            <div id="map" class="w-full h-full z-0"></div>

            <!-- Toast Notification Box -->
            <div id="toast" class="hidden absolute bottom-6 right-6 z-30 bg-slate-800 text-slate-100 border border-amber-500/50 px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 transition-all duration-300 transform translate-y-2">
                <div class="w-8 h-8 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-check text-sm"></i>
                </div>
                <span id="toast-msg" class="text-xs font-medium">訊息已成功處理</span>
            </div>
        </main>
    </div>

    <script>
        /* Embedded dataset parsed from kaohsiung_gyms.csv */
        const RAW_CSV_DATA = `店名,經度,緯度,電話,地址
六合健身房Liouhe Gym,120.2982,22.6315,+886 7 285 2597,800高雄市新興區秋山里六合二路12號8樓
高雄有家健身中心-自由店,120.3061,22.6588,+886 7 556 2777,高雄市左營區自由二路118號B1
高雄 城市健身房CITYFITNESS,120.3015,22.6455,+886 7 550 6062,807高雄市三民區安邦里重慶街177號
健身寓 Home Gym,120.3012,22.6231,+886 908 177 607,801高雄市前金區文東里中山二路535號
高雄有家健身中心-中正店,120.3121,22.6308,+886 7 222 0088,80047高雄市新興區文昌里中正二路218號2樓`;

        let map;
        let markersGroup;
        let gymData = [];
        let markerMap = new Map();
        let currentSelectedId = null;

        /* Utility function to sanitize string and prevent XSS injection */
        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function parseCSVData(csvText) {
            const lines = csvText.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            const list = [];

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split(',').map(c => c.trim());
                if (cols.length >= 5) {
                    const lng = parseFloat(cols[1]);
                    const lat = parseFloat(cols[2]);
                    
                    // Validate numbers to prevent map breakage
                    if (!isNaN(lat) && !isNaN(lng)) {
                        list.push({
                            id: i,
                            name: cols[0],
                            lng: lng,
                            lat: lat,
                            phone: cols[3],
                            address: cols[4]
                        });
                    }
                }
            }
            return list;
        }

        function initMap() {
            // Kaohsiung Center Default LatLng
            map = L.map('map', {
                zoomControl: false
            }).setView([22.638, 120.302], 14);

            // Add Zoom Control to Top Right
            L.control.zoom({ position: 'topright' }).addTo(map);

            // OpenStreetMap Dark/CartoDB Dark Matter tile layer for modern dark aesthetic
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            markersGroup = L.layerGroup().addTo(map);
        }

        function createCustomIcon(isSelected = false) {
            const color = isSelected ? '#f59e0b' : '#ea580c';
            const size = isSelected ? 42 : 36;
            
            const svgIcon = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="${size}" height="${size}">
                <path fill="${color}" stroke="#ffffff" stroke-width="1.5" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
                <circle cx="12" cy="9" r="4" fill="#ffffff"/>
                <path d="M10 8.5h4M10.5 7.5v2M13.5 7.5v2" stroke="${color}" stroke-width="1.2" stroke-linecap="round"/>
            </svg>`;

            return L.divIcon({
                className: 'custom-leaflet-marker',
                html: svgIcon,
                iconSize: [size, size],
                iconAnchor: [size / 2, size],
                popupAnchor: [0, -size + 4]
            });
        }

        function buildPopupContent(gym) {
            const googleNavUrl = `https://www.google.com/maps/dir/?api=1&destination=${gym.lat},${gym.lng}`;
            const cleanPhone = gym.phone.replace(/\s+/g, '');

            return `
                <div class="bg-slate-800 text-slate-100 rounded-xl overflow-hidden shadow-xl border border-slate-700">
                    <div class="bg-gradient-to-r from-amber-500 to-orange-600 px-4 py-3">
                        <span class="inline-block px-2 py-0.5 bg-slate-900/40 text-white font-medium text-[10px] rounded-md mb-1 backdrop-blur-sm">健身房據點</span>
                        <h3 class="font-bold text-white text-base leading-tight">${escapeHTML(gym.name)}</h3>
                    </div>
                    <div class="p-4 space-y-2.5 text-xs text-slate-300">
                        <div class="flex items-start space-x-2.5">
                            <i class="fa-solid fa-location-dot text-amber-400 mt-0.5 shrink-0"></i>
                            <span class="flex-1 leading-snug">${escapeHTML(gym.address)}</span>
                        </div>
                        <div class="flex items-center space-x-2.5">
                            <i class="fa-solid fa-phone text-amber-400 shrink-0"></i>
                            <a href="tel:${escapeHTML(cleanPhone)}" class="text-amber-300 hover:underline font-medium">${escapeHTML(gym.phone)}</a>
                        </div>
                    </div>
                    <div class="px-4 pb-4 pt-1 flex items-center space-x-2">
                        <a href="${googleNavUrl}" target="_blank" rel="noopener noreferrer" 
                           class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold py-2 px-3 rounded-lg text-center transition flex items-center justify-center space-x-1.5 shadow-md shadow-amber-500/10">
                            <i class="fa-solid fa-diamond-turn-right text-xs"></i>
                            <span>導航</span>
                        </a>
                        <button onclick="copyToClipboard('${escapeHTML(gym.address)}')" 
                                class="bg-slate-700 hover:bg-slate-600 text-slate-200 py-2 px-3 rounded-lg transition flex items-center justify-center space-x-1">
                            <i class="fa-regular fa-copy text-xs"></i>
                            <span>複製</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function renderMarkers(data) {
            markersGroup.clearLayers();
            markerMap.clear();

            if (data.length === 0) return;

            const latLngs = [];

            data.forEach(gym => {
                const marker = L.marker([gym.lat, gym.lng], {
                    icon: createCustomIcon(gym.id === currentSelectedId)
                });

                marker.bindPopup(buildPopupContent(gym));

                marker.on('click', () => {
                    selectGym(gym.id, false);
                });

                markersGroup.addLayer(marker);
                markerMap.set(gym.id, marker);
                latLngs.push([gym.lat, gym.lng]);
            });

            // Dynamically fit map bounds to show all markers
            if (latLngs.length > 0) {
                const bounds = L.latLngBounds(latLngs);
                map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
            }
        }

        function renderSidebarList(data) {
            const listContainer = document.getElementById('gym-list');
            document.getElementById('total-count').innerText = data.length;

            if (data.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-12 text-slate-500">
                        <i class="fa-solid fa-dumbbell text-3xl mb-2 opacity-40"></i>
                        <p class="text-sm">找不到符合條件的健身房</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = data.map(gym => {
                const isSelected = gym.id === currentSelectedId;
                const activeClass = isSelected 
                    ? 'border-amber-500 bg-slate-700/80 shadow-lg shadow-amber-500/5' 
                    : 'border-slate-700/70 bg-slate-800/80 hover:border-slate-600 hover:bg-slate-700/50';

                return `
                    <div id="gym-card-${gym.id}" onclick="selectGym(${gym.id}, true)" 
                         class="cursor-pointer border rounded-2xl p-4 transition-all duration-200 ${activeClass}">
                        <div class="flex items-start justify-between">
                            <h3 class="font-bold text-slate-100 text-sm leading-snug">${escapeHTML(gym.name)}</h3>
                            <span class="text-[10px] bg-slate-700 text-amber-400 font-semibold px-2 py-0.5 rounded-md shrink-0 ml-2">據點</span>
                        </div>
                        <div class="mt-2.5 space-y-1.5 text-xs text-slate-300">
                            <div class="flex items-start space-x-2">
                                <i class="fa-solid fa-location-dot text-slate-400 mt-0.5 shrink-0"></i>
                                <span class="line-clamp-1">${escapeHTML(gym.address)}</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <i class="fa-solid fa-phone text-slate-400 shrink-0"></i>
                                <span>${escapeHTML(gym.phone)}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectGym(gymId, panToMap = true) {
            currentSelectedId = gymId;

            // Update markers styling
            markerMap.forEach((marker, id) => {
                marker.setIcon(createCustomIcon(id === gymId));
            });

            const gym = gymData.find(g => g.id === gymId);
            if (gym) {
                const marker = markerMap.get(gymId);
                if (marker) {
                    if (panToMap) {
                        map.flyTo([gym.lat, gym.lng], 16, { duration: 1 });
                        setTimeout(() => {
                            marker.openPopup();
                        }, 800);
                    } else {
                        marker.openPopup();
                    }
                }

                // Update List View Active Card
                document.querySelectorAll('#gym-list > div').forEach(card => {
                    card.classList.remove('border-amber-500', 'bg-slate-700/80', 'shadow-lg');
                    card.classList.add('border-slate-700/70', 'bg-slate-800/80');
                });

                const activeCard = document.getElementById(`gym-card-${gymId}`);
                if (activeCard) {
                    activeCard.classList.remove('border-slate-700/70', 'bg-slate-800/80');
                    activeCard.classList.add('border-amber-500', 'bg-slate-700/80', 'shadow-lg');
                    activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }

            // Mobile auto-collapse sidebar
            if (window.innerWidth < 768 && panToMap) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }
        }

        function filterGyms() {
            const searchTerm = document.getElementById('search-input').value.trim().toLowerCase();
            const activeTag = document.querySelector('.district-tag.active');
            const selectedDistrict = activeTag ? activeTag.dataset.district : 'ALL';

            const filtered = gymData.filter(gym => {
                const matchesSearch = gym.name.toLowerCase().includes(searchTerm) || 
                                      gym.address.toLowerCase().includes(searchTerm) || 
                                      gym.phone.includes(searchTerm);
                
                const matchesDistrict = selectedDistrict === 'ALL' || gym.address.includes(selectedDistrict);

                return matchesSearch && matchesDistrict;
            });

            renderMarkers(filtered);
            renderSidebarList(filtered);
        }

        function copyToClipboard(text) {
            const tempInput = document.createElement('input');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            showToast('已將地址複製至剪貼簿！');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.innerText = message;
            
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.remove('translate-y-2');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, 300);
            }, 2500);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            
            // Load and parse CSV Data
            gymData = parseCSVData(RAW_CSV_DATA);
            renderMarkers(gymData);
            renderSidebarList(gymData);

            // Search input listener
            const searchInput = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-search-btn');

            searchInput.addEventListener('input', (e) => {
                if (e.target.value) {
                    clearBtn.classList.remove('hidden');
                } else {
                    clearBtn.classList.add('hidden');
                }
                filterGyms();
            });

            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearBtn.classList.add('hidden');
                filterGyms();
            });

            // District Tags filter listener
            document.querySelectorAll('.district-tag').forEach(tag => {
                tag.addEventListener('click', function() {
                    document.querySelectorAll('.district-tag').forEach(t => {
                        t.classList.remove('active', 'bg-amber-500', 'text-slate-950', 'font-semibold');
                        t.classList.add('bg-slate-700', 'text-slate-300');
                    });
                    this.classList.add('active', 'bg-amber-500', 'text-slate-950', 'font-semibold');
                    this.classList.remove('bg-slate-700', 'text-slate-300');
                    filterGyms();
                });
            });

            // Mobile sidebar toggle button
            const toggleSidebarBtn = document.getElementById('toggle-sidebar-btn');
            const sidebar = document.getElementById('sidebar');

            toggleSidebarBtn.addEventListener('click', () => {
                sidebar.classList.toggle('-translate-x-full');
            });
        });
    </script>
</body>
</html>
