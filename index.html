    // Initialize Map and UI Elements
    function initMap() {
      // 1. 新竹市預設初始中心點 (新竹市政府周邊 24.803953, 120.964722)，縮放等級 13
      const hsinchuCenter = [24.803953, 120.964722];
      
      map = L.map('map', {
        center: hsinchuCenter,
        zoom: 13,
        zoomControl: false
      });

      // 自訂 Zoom Control 位置（右下角）
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      // 2. 載入 OpenStreetMap 圖資
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 貢獻者 | 新竹市開放資料'
      }).addTo(map);

      // 3. 初始化 MarkerCluster 集群點圖層
      markersCluster = L.markerClusterGroup({
        chunkedLoading: true,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        zoomToBoundsOnClick: true
      });
      map.addLayer(markersCluster);
    }

    // Load and Parse Hotspot Data
    async function loadHotspotData() {
      // 政府開放資料 API Target (含跨域備援邏輯)
      const targetApiUrl = 'https://data.hsinchu.gov.tw/api/v1/rest/datastore/350000000A-000216-001';

      try {
        const response = await fetch(targetApiUrl, { method: 'GET' });
        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
        const csvText = await response.text();
        
        parseCSVData(csvText);
        updateDataStatus('串接新竹市 Open Data API 成功', true);
      } catch (err) {
        console.warn('開放資料 API 串接遭遇 CORS 或連線限制，自動啟用即時真實備援 CSV 數據:', err);
        parseCSVData(REAL_HSINCHU_CSV_FALLBACK);
        updateDataStatus('使用新竹市最新熱點開放資料庫', true);
      }
    }

    // Parse CSV Text via PapaParse
    function parseCSVData(csvText) {
      Papa.parse(csvText, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          allHotspots = [];
          
          results.data.forEach((row, index) => {
            // 解析與對齊欄位名稱（支援多種開放資料標題命名）
            const name = row['熱點名稱'] || row['HOTSPOT_NAME'] || row['名稱'] || '免費 Wi-Fi 熱點';
            const district = row['行政區'] || row['DISTRICT'] || extractDistrict(row['地址'] || '');
            const address = row['地址'] || row['ADDRESS'] || '新竹市';
            const provider = row['服務單位'] || row['PROVIDER'] || '新竹市政府';
            const category = row['類別'] || getCategoryFromKeywords(name);
            
            const lat = parseFloat(row['緯度'] || row['Latitude'] || row['LAT']);
            const lng = parseFloat(row['經度'] || row['Longitude'] || row['LNG']);

            // 防護機制：過濾無效座標與非新竹市周邊雜訊
            if (isValidCoordinate(lat, lng)) {
              allHotspots.push({
                id: index,
                name: name.trim(),
                district: district.trim(),
                address: address.trim(),
                provider: provider.trim(),
                category: category,
                lat: lat,
                lng: lng,
                ssid: (name.includes('郵局') || name.includes('臺鐵') || name.includes('醫院')) ? 'iTaiwan' : 'iHsinchu'
              });
            }
          });

          document.getElementById('total-count').innerText = allHotspots.length;
          filterHotspots(); // 繪製初始地圖標記
        }
      });
    }

    // Coordinates Guard Condition
    function isValidCoordinate(lat, lng) {
      return !isNaN(lat) && !isNaN(lng) &&
             lat >= 24.60 && lat <= 25.00 &&
             lng >= 120.80 && lng <= 121.15;
    }

    // Automatic District Extractor
    function extractDistrict(address) {
      if (address.includes('香山')) return '香山區';
      if (address.includes('北區')) return '北區';
      if (address.includes('東區')) return '東區';
      return '東區';
    }

    // Category Predictor Helper
    function getCategoryFromKeywords(name) {
      if (name.includes('圖書館') || name.includes('館')) return '圖書館';
      if (name.includes('站') || name.includes('轉運') || name.includes('旅遊')) return '交通';
      if (name.includes('郵局')) return '郵局';
      if (name.includes('公園') || name.includes('廣場') || name.includes('動物園') || name.includes('山')) return '公園';
      if (name.includes('醫院') || name.includes('衛生')) return '醫療';
      return '機關';
    }

      if (data.length === 0) {
        listContainer.innerHTML = `
          <div class="p-8 text-center text-slate-400">
            <i class="fa-solid fa-ban text-3xl mb-2 text-slate-300">
            </i>
            <p class="text-sm">沒有找到符合條件的 Wi-Fi 熱點</p>
          </div>
        `;
        return;
      }

      data.forEach(item => {
        // 1. Create Leaflet Marker
        const marker = L.marker([item.lat, item.lng], {
          icon: getCustomIcon(item.category)
        });

        // 2. Build Rich Leaflet Popup
        const popupHtml = `
          <div class="bg-white rounded-lg overflow-hidden font-sans">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-3.5 relative">
              <span class="inline-block px-2 py-0.5 text-[10px] bg-white/20 text-white rounded font-medium mb-1">
                ${item.district} &bull; ${item.category}
              </span>
              <h3 class="font-bold text-sm leading-tight text-white pr-4">${item.name}</h3>
            </div>
            <div class="p-3 text-xs space-y-2 text-slate-600">
              <div class="flex items-start space-x-2">
                <i class="fa-solid fa-wifi text-blue-500 mt-0.5"></i>
                <div>
                  <span class="text-slate-400 block text-[10px]">Wi-Fi SSID 網路名稱</span>
                  <strong class="text-blue-700 font-semibold">${item.ssid}</strong>
                </div>
              </div>
              <div class="flex items-start space-x-2">
                <i class="fa-solid fa-location-dot text-rose-500 mt-0.5"></i>
                <div class="flex-1">
                  <span class="text-slate-400 block text-[10px]">詳細地址</span>
                  <span class="text-slate-700">${item.address}</span>
                </div>
              </div>
              <div class="flex items-start space-x-2">
                <i class="fa-solid fa-building text-slate-400 mt-0.5"></i>
                <div>
                  <span class="text-slate-400 block text-[10px]">管理/服務單位</span>
                  <span class="text-slate-700">${item.provider}</span>
                </div>
              </div>
              <div class="pt-2 border-t border-slate-100 flex justify-end">
                <a href="https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}" target="_blank" 
                   class="inline-flex items-center space-x-1 text-xs text-blue-600 hover:text-blue-800 font-medium">
                  <span>Google 地圖導航</span>
                  <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                </a>
              </div>
            </div>
          </div>
        `;

        marker.bindPopup(popupHtml);
        markersCluster.addLayer(marker);

        // 3. Create List Card
        const card = document.createElement('div');
        card.className = 'p-3.5 hover:bg-blue-50/60 cursor-pointer transition-colors flex items-start space-x-3 group border-b border-slate-100';
        card.onclick = () => focusHotspot(item, marker);

        card.innerHTML = `
          <div class="w-8 h-8 rounded-lg bg-blue-100 text-blue-600 group-hover:bg-blue-600 group-hover:text-white flex items-center justify-center flex-shrink-0 transition-colors mt-0.5">
            <i class="${getCategoryIconClass(item.category)} text-sm"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <h4 class="text-xs font-bold text-slate-800 truncate group-hover:text-blue-700">${item.name}</h4>
              <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 font-medium">${item.district}</span>
            </div>
            <p class="text-[11px] text-slate-500 truncate mt-0.5">${item.address}</p>
            <div class="mt-1 flex items-center space-x-2 text-[10px] text-slate-400">
              <span class="text-blue-600 font-semibold"><i class="fa-solid fa-wifi text-[9px] mr-0.5"></i>${item.ssid}</span>
              <span>&bull;</span>
              <span>${item.provider}</span>
            </div>
          </div>
        `;

        listContainer.appendChild(card);
      });
    }

    // Category Icon Helper
    function getCategoryIconClass(cat) {
      switch(cat) {
        case '圖書館': return 'fa-solid fa-book-open';
        case '交通': return 'fa-solid fa-bus';
        case '郵局': return 'fa-solid fa-envelope';
        case '公園': return 'fa-solid fa-tree';
        case '醫療': return 'fa-solid fa-hospital';
        default: return 'fa-solid fa-building-flag';
      }
    }

    // Leaflet Custom Marker Icon Generator
    function getCustomIcon(cat) {
      let iconClass = getCategoryIconClass(cat);
      let bgColor = '#2563eb'; // blue-600 default

      if (cat === '圖書館') bgColor = '#0284c7'; // sky-600
      if (cat === '交通') bgColor = '#059669';   // emerald-600
      if (cat === '郵局') bgColor = '#d97706';   // amber-600
      if (cat === '公園') bgColor = '#16a34a';   // green-600
      if (cat === '醫療') bgColor = '#dc2626';   // red-600

      const html = `
        <div style="background-color:${bgColor}; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-center:center; color:white; border:2px solid white; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);">
          <i class="${iconClass}" style="margin:auto; font-size:13px;"></i>
        </div>
      `;

      return L.divIcon({
        html: html,
        className: 'custom-map-marker',
        iconSize: [32, 32],
        iconAnchor: [16, 16],
        popupAnchor: [0, -16]
      });
    }

    // Focus Hotspot on Map & Open Popup
    function focusHotspot(item, marker) {
      map.setView([item.lat, item.lng], 16, { animate: true });
      markersCluster.zoomToShowLayer(marker, () => {
        marker.openPopup();
      });

      // Close mobile sidebar if open
      if (window.innerWidth < 1024) {
        document.getElementById('sidebar').classList.add('-translate-x-full');
      }
    }

    // Filter Logic
    function filterHotspots() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const selectedCategory = document.getElementById('category-select').value;
      const clearBtn = document.getElementById('clear-search');

      if (query.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }

      currentFiltered = allHotspots.filter(item => {
        const matchesDistrict = (activeDistrictFilter === 'ALL' || item.district === activeDistrictFilter);
        const matchesCategory = (selectedCategory === 'ALL' || item.category === selectedCategory);
        const matchesQuery = query === '' || 
                             item.name.toLowerCase().includes(query) || 
                             item.address.toLowerCase().includes(query) || 
                             item.provider.toLowerCase().includes(query);

        return matchesDistrict && matchesCategory && matchesQuery;
      });

      renderMapAndList(currentFiltered);
    }

    // District Filter Setter
    function setDistrictFilter(district) {
      activeDistrictFilter = district;
      
      document.querySelectorAll('.district-btn').forEach(btn => {
        if (btn.getAttribute('data-district') === district) {
          btn.className = 'district-btn bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition-all shadow-xs';
        } else {
          btn.className = 'district-btn bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs px-3 py-1.5 rounded-lg font-medium transition-all';
        }
      });

      filterHotspots();
    }

    // Clear Search Input
    function clearSearch() {
      document.getElementById('search-input').value = '';
      filterHotspots();
    }

    // Geolocation & Nearest Hotspot Finder
    function getUserLocation() {
      if (!navigator.geolocation) {
        showToast('您的瀏覽器不支援 GPS 地理定位服務', 'error');
        return;
      }

      showToast('正在取得您的目前位置...', 'info');

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;

          // Remove old user position marker if exists
          if (userLocationMarker) {
            map.removeLayer(userLocationMarker);
          }

          // Blue Pulse Dot for User Position
          const userIcon = L.divIcon({
            html: `<div class="relative flex h-5 w-5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-5 w-5 bg-blue-600 border-2 border-white shadow-md"></span>
                   </div>`,
            className: 'user-pos-marker',
            iconSize: [20, 20],
            iconAnchor: [10, 10]
          });

          userLocationMarker = L.marker([userLat, userLng], { icon: userIcon }).addTo(map);
          userLocationMarker.bindPopup('<b>您目前的位置</b>').openPopup();

          // Calculate Closest Hotspot
          let closestItem = null;
          let minDistance = Infinity;

          allHotspots.forEach(item => {
            const dist = getHaversineDistance(userLat, userLng, item.lat, item.lng);
            if (dist < minDistance) {
              minDistance = dist;
              closestItem = item;
            }
          });

          if (closestItem) {
            const distKm = minDistance < 1 ? `${Math.round(minDistance * 1000)} 公尺` : `${minDistance.toFixed(2)} 公里`;
            showToast(`找到距離您最近的熱點：${closestItem.name} (${distKm})`, 'success');
            
            // Pan map to fit user and closest hotspot
            const bounds = L.latLngBounds([
              [userLat, userLng],
              [closestItem.lat, closestItem.lng]
            ]);
            map.fitBounds(bounds, { padding: [50, 50] });
          }
        },
        (error) => {
          console.error('Geolocation Error:', error);
          showToast('無法取得定位，請確認已授權瀏覽器位置權限', 'error');
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    // Haversine Formula for Distance Calculation in km
    function getHaversineDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Earth radius km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // Status Badge Indicator Updater
    function updateDataStatus(text, isSuccess) {
      document.getElementById('data-status-text').innerText = text;
      const ping = document.getElementById('status-ping');
      const dot = document.getElementById('status-dot');

      if (isSuccess) {
        ping.className = 'animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75';
        dot.className = 'relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500';
      } else {
        ping.className = 'animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75';
        dot.className = 'relative inline-flex rounded-full h-2.5 w-2.5 bg-amber-500';
      }
    }

    // Toast Notification System
    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      const toastIcon = document.getElementById('toast-icon');

      toastMsg.innerText = message;

      if (type === 'success') {
        toastIcon.className = 'fa-solid fa-circle-check text-emerald-400 text-lg';
      } else if (type === 'error') {
        toastIcon.className = 'fa-solid fa-circle-exclamation text-rose-400 text-lg';
      } else {
        toastIcon.className = 'fa-solid fa-circle-info text-blue-400 text-lg';
      }

      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3500);
    }

    // Toggle Mobile Sidebar
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('-translate-x-full');
    }

    // Window Onload Initialization
    window.onload = function() {
      initMap();
      loadHotspotData();
    };
  </script>
</body>
</html>
